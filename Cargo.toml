[package]
name = "vitals"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Tiny Linux system-metrics line (CPU, memory, swap, disks, clock) for the tmux status bar"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joanfabregat/vitals"
readme = "README.md"
keywords = ["tmux", "status-bar", "cpu", "memory", "linux"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
